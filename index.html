<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor 3D</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
#loading {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  color: #ddd; font-family: sans-serif; font-size: 16px;
  text-align: center; pointer-events: none; z-index: 10;
}
#panel-derecho {
  position: absolute; top: 16px; right: 16px;
  background: rgba(15,15,15,0.88);
  backdrop-filter: blur(8px);
  color: #ccc; font-family: 'Segoe UI', sans-serif; font-size: 12px;
  padding: 16px; border-radius: 12px; width: 180px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  z-index: 20;
}
#panel-derecho h3 {
  margin: 0 0 8px 0; font-size: 11px; color: #888;
  text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 6px;
}
#panel-derecho label {
  display: block; margin-top: 8px; margin-bottom: 4px;
  color: #aaa; font-size: 11px;
}
#panel-derecho input[type="range"] {
  width: 100%; accent-color: #fff; height: 3px; cursor: pointer;
}
#hint {
  position: absolute; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.55);
  color: #ddd; font-family: 'Segoe UI', sans-serif; font-size: 12px;
  padding: 6px 16px; border-radius: 20px;
  pointer-events: none; opacity: 0;
  transition: opacity 0.4s;
  z-index: 20;
}
#hint.visible { opacity: 1; }
/* Canvas AO overlay encima del canvas 3D */
#ao-canvas {
  position: absolute; top: 0; left: 0;
  pointer-events: none; z-index: 5;
  opacity: 1; display: none;
  mix-blend-mode: multiply;   /* multiplica el gris AO sobre el color */
}
</style>
</head>
<body>

<div id="loading">Cargando modelo…</div>
<div id="hint">Doble tap para volver</div>
<!-- Canvas 2D que recibe el mapa AO como overlay multiplicativo -->
<canvas id="ao-canvas"></canvas>

<div id="panel-derecho">
  <h3>Luz Global</h3>
  <label>Intensidad</label>
  <input type="range" id="global-intensidad" min="0" max="5" step="0.05" value="1">

  <label style="margin-top:10px;">Nichos <span id="lbl-nichos">3.5</span></label>
  <input type="range" id="nichos-intensidad" min="0" max="10" step="0.1" value="3.5">

  <label style="margin-top:14px;">HDRI</label>
  <select id="hdri-select" style="width:100%; background:#1a1a1a; color:#ccc;
    border:1px solid rgba(255,255,255,0.12); border-radius:6px;
    padding:4px 6px; font-size:11px; cursor:pointer;">
    <option value="studio016">Studio 016</option>
    <option value="studio017">Studio 017</option>
    <option value="studio018">Studio 018</option>
    <option value="countryclub">country club</option>
  </select>
  <label style="margin-top:8px; display:flex; align-items:center; gap:6px; cursor:pointer; color:#aaa; font-size:11px;">
    <input type="checkbox" id="hdri-fondo"> HDRI como fondo
  </label>

  <div id="ao-section" style="margin-top:12px; border-top:1px solid rgba(255,255,255,0.06); padding-top:10px;">
    <h3 style="margin:0 0 8px 0; font-size:11px; color:#888;
      text-transform:uppercase; letter-spacing:1px; font-weight:600;">
      Ambient Occlusion
    </h3>
    <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin-bottom:8px;">
      <input type="checkbox" id="ao-toggle"> Activar AO
    </label>
    <label>Radius <span id="lbl-radius">0.15</span></label>
    <input type="range" id="ao-radius" min="0.01" max="1.0" step="0.01" value="0.15">
    <label>Intensidad <span id="lbl-intensity">1.0</span></label>
    <input type="range" id="ao-intensity" min="0" max="3" step="0.05" value="1">
    <label>Samples <span id="lbl-samples">16</span></label>
    <input type="range" id="ao-samples" min="4" max="32" step="1" value="16">
    <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin-top:6px;">
      <input type="checkbox" id="ao-only"> AO Only
    </label>
  </div>

  <div id="color-section" style="display:none; margin-top:12px;">
    <h3 id="color-titulo" style="margin:0 0 8px 0; font-size:11px; color:#888;
      text-transform:uppercase; letter-spacing:1px; font-weight:600;
      border-bottom:1px solid rgba(255,255,255,0.06); padding-bottom:6px;">
      Colores
    </h3>
    <div id="color-swatches" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>

<script>
'use strict';

// ══════════════════════════════════════════════════════════════════════════════
//  SSAO  —  pipeline correcto para esta escena
//
//  El problema de la versión anterior:
//    • el composite shader multiplicaba AO sobre TODA la escena
//      (fondo + vestier + prendas), oscureciéndola completa.
//    • El RT de escena perdía el tone-mapping ACES → resultado gris/oscuro.
//
//  Solución actual (2 pasos limpios):
//    1. Render separado SOLO de las prendas → depth + normales en RT propio.
//       El fondo y el vestier NO entran en ese RT → no reciben AO.
//    2. Shader AO lee ese depth/normal y produce un mapa gris 0-1.
//    3. Ese mapa se blitea en un <canvas> 2D con mix-blend-mode: multiply
//       encima del canvas Three.js → no toca el pipeline de iluminación,
//       no rompe el tone-mapping, no afecta el fondo.
//    4. "AO Only": muestra solo el canvas AO con fondo blanco → gris limpio.
// ══════════════════════════════════════════════════════════════════════════════

// ── Shader AO ─────────────────────────────────────────────────────────────────
//   Lee depth + normal reconstruidas, produce escala de grises 0(ocluido)–1(libre)
const SSAO_VERT = `
  varying vec2 vUv;
  void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
`;

const SSAO_FRAG = `
  precision highp float;
  uniform sampler2D tDepth;
  uniform sampler2D tNormal;
  uniform vec2  uSize;
  uniform float uRadius;     // radio en unidades de vista (ajusta con la escena)
  uniform float uBias;
  uniform float uIntensity;  // 0-3
  uniform int   uSamples;    // 4-32
  uniform float cameraNear;
  uniform float cameraFar;
  uniform mat4  projMatrix;
  uniform mat4  invProjMatrix;
  varying vec2 vUv;

  // ── Ruido ──────────────────────────────────────────────────────────────────
  float rand(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

  // ── Profundidad lineal ─────────────────────────────────────────────────────
  float linearDepth(float d) {
    float z = d * 2.0 - 1.0;
    return (2.0 * cameraNear * cameraFar) / (cameraFar + cameraNear - z * (cameraFar - cameraNear));
  }

  // ── Posición en espacio de vista ───────────────────────────────────────────
  vec3 viewPos(vec2 uv) {
    float d    = texture2D(tDepth, uv).r;
    vec4  clip = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
    vec4  view = invProjMatrix * clip;
    return view.xyz / view.w;
  }

  // ── Kernel hemisférico fijo de 32 muestras ─────────────────────────────────
  const vec3 K[32] = vec3[32](
    vec3(0.049, 0.008,0.154),vec3(-0.099,-0.178,0.067),
    vec3(0.015, 0.287,0.143),vec3(-0.234, 0.105,0.110),
    vec3(0.218,-0.162,0.077),vec3(-0.037, 0.349,0.183),
    vec3(0.108, 0.027,0.386),vec3(-0.319,-0.082,0.179),
    vec3(0.041, 0.423,0.220),vec3( 0.257,-0.337,0.162),
    vec3(-0.148,0.079,0.554),vec3( 0.369, 0.189,0.240),
    vec3(-0.083,-0.504,0.299),vec3(0.454, 0.044,0.296),
    vec3(-0.182,0.524,0.358),vec3(0.022,-0.624,0.416),
    vec3(0.582, 0.128,0.376),vec3(-0.314,-0.561,0.453),
    vec3(0.156, 0.688,0.430),vec3(-0.638, 0.201,0.491),
    vec3(0.395,-0.583,0.512),vec3(-0.073, 0.734,0.531),
    vec3(0.691, 0.268,0.566),vec3(-0.481,-0.612,0.569),
    vec3(0.228, 0.791,0.614),vec3(-0.742, 0.118,0.640),
    vec3(0.534,-0.661,0.642),vec3(-0.123, 0.849,0.667),
    vec3(0.798, 0.372,0.712),vec3(-0.609,-0.715,0.738),
    vec3(0.282, 0.897,0.765),vec3(-0.826, 0.214,0.795)
  );

  void main() {
    float d = texture2D(tDepth, vUv).r;

    // Píxel sin geometría (fondo) → blanco = sin oclusión
    if (d >= 0.9999) { gl_FragColor = vec4(1.0); return; }

    vec3 norm = normalize(texture2D(tNormal, vUv).rgb * 2.0 - 1.0);
    vec3 fpos = viewPos(vUv);

    // Base TBN rotada con ruido por fragmento
    float angle    = rand(vUv * 43.47) * 6.28318;
    vec3  rvec     = vec3(cos(angle), sin(angle), 0.0);
    vec3  tangent  = normalize(rvec - norm * dot(rvec, norm));
    vec3  bitan    = cross(norm, tangent);
    mat3  TBN      = mat3(tangent, bitan, norm);

    float occ = 0.0;
    for (int i = 0; i < 32; i++) {
      if (i >= uSamples) break;

      vec3 sp    = fpos + TBN * K[i] * uRadius;
      vec4 off   = projMatrix * vec4(sp, 1.0);
      off.xy    /= off.w;
      off.xy     = off.xy * 0.5 + 0.5;

      float sd   = linearDepth(texture2D(tDepth, off.xy).r);
      float rck  = smoothstep(0.0, 1.0, uRadius / max(abs(fpos.z - sd), 0.001));
      occ       += (sd >= sp.z + uBias ? 1.0 : 0.0) * rck;
    }

    float ao = 1.0 - clamp((occ / float(uSamples)) * uIntensity, 0.0, 1.0);
    gl_FragColor = vec4(vec3(ao), 1.0);
  }
`;

// ── Shader Blur 2-pass ────────────────────────────────────────────────────────
const BLUR_FRAG = `
  precision mediump float;
  uniform sampler2D tAO;
  uniform vec2 uSize;
  uniform vec2 uDir;
  varying vec2 vUv;
  void main() {
    vec2 t = 1.0 / uSize;
    float w[5]; w[0]=0.0625;w[1]=0.25;w[2]=0.375;w[3]=0.25;w[4]=0.0625;
    float r = 0.0;
    for (int i = -2; i <= 2; i++)
      r += texture2D(tAO, vUv + uDir * t * float(i)).r * w[i+2];
    gl_FragColor = vec4(vec3(r), 1.0);
  }
`;
const BLUR_VERT = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`;

// ══════════════════════════════════════════════════════════════════════════════
//  RENDERER & ESCENA
// ══════════════════════════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.physicallyCorrectLights = true;
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.toneMapping     = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.domElement.style.touchAction = 'none';
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2b2b);

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envTexture = null;

function cargarHDRI(nombre) {
  new THREE.RGBELoader().setPath('Hdri/').load(nombre + '.hdr', (hdr) => {
    if (envTexture) envTexture.dispose();
    envTexture = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose();
    scene.environment = envTexture;
    scene.traverse(n => { if (n.isMesh && n.material) { n.material.envMap = envTexture; n.material.needsUpdate = true; }});
  }, undefined, e => console.error('[HDRI]', e));
}
cargarHDRI('studio016');
document.getElementById('hdri-select').addEventListener('change', e => cargarHDRI(e.target.value));

// ── Fondo plano ───────────────────────────────────────────────────────────────
const BG_IMAGE_PATH = 'Backgrounds/Vestier_v009.png';
const BG_ASPECT = 1920 / 1080;
let bgImgAspect = BG_ASPECT, camFovBase = 50, fondoDome = null;
const bgBase = { origin: new THREE.Vector3(), height: 1, maxDim: 1 };

const fondoVertex = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,1.0,1.0); }`;
const fondoFragment = `
  uniform sampler2D map; uniform float uScreenAspect,uImgAspect,uZoom; uniform vec2 uOffset;
  varying vec2 vUv;
  void main(){
    vec2 uv=vUv-0.5;
    if(uScreenAspect>uImgAspect) uv.y*=uImgAspect/uScreenAspect; else uv.x*=uScreenAspect/uImgAspect;
    uv=uv/uZoom+0.5+uOffset;
    gl_FragColor=vec4(texture2D(map,uv).rgb,1.0);
  }`;

function crearFondoDome() {
  const mat = new THREE.ShaderMaterial({
    uniforms:{ map:{value:null}, uScreenAspect:{value:window.innerWidth/window.innerHeight},
               uImgAspect:{value:BG_ASPECT}, uZoom:{value:1}, uOffset:{value:new THREE.Vector2(0,0)} },
    vertexShader:fondoVertex, fragmentShader:fondoFragment, depthTest:false, depthWrite:false
  });
  fondoDome = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat);
  fondoDome.frustumCulled=false; fondoDome.renderOrder=-1000; fondoDome.visible=false;
  scene.add(fondoDome);
  new THREE.TextureLoader().load(BG_IMAGE_PATH, tex => {
    tex.generateMipmaps=false; tex.minFilter=tex.magFilter=THREE.LinearFilter;
    tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping; mat.uniforms.map.value=tex;
    if (tex.image?.width){ mat.uniforms.uImgAspect.value=tex.image.width/tex.image.height; bgImgAspect=mat.uniforms.uImgAspect.value; ajustarFovCamara(); }
  }, undefined, e=>console.error('[Fondo]',e));
}
crearFondoDome();

function actualizarFondo() {
  if (!fondoDome) return;
  const u=fondoDome.material.uniforms;
  u.uZoom.value=1; u.uOffset.value.set(0,0);
  u.uScreenAspect.value=window.innerWidth/window.innerHeight;
}
window.addEventListener('resize', actualizarFondo);
document.getElementById('hdri-fondo').addEventListener('change', e=>{
  const on=e.target.checked;
  if(fondoDome) fondoDome.visible=on;
  if(vestierRoot) vestierRoot.visible=!on;
  if(on) actualizarFondo();
});

// ── Cámara ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 5000);
camera.name='CamaraPrincipal'; camera.position.set(4,3,6);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.enablePan=false;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
controls.minAzimuthAngle=-Math.PI/20; controls.maxAzimuthAngle=Math.PI/2;
controls.maxPolarAngle=Math.PI/2-0.05; controls.minPolarAngle=0.7;

function ajustarFovCamara(){
  const sa=window.innerWidth/window.innerHeight;
  const k=sa>bgImgAspect?bgImgAspect/sa:1;
  camera.fov=2*Math.atan(Math.tan(camFovBase*Math.PI/360)*k)*180/Math.PI;
  camera.aspect=sa; camera.updateProjectionMatrix();
}

// ── Luces ──────────────────────────────────────────────────────────────────────
const ambientLight=new THREE.AmbientLight(0xffffff,0.6);
const hemiLight=new THREE.HemisphereLight(0xffffff,0x444444,0.8);
scene.add(ambientLight,hemiLight);

const luzNichos = [
  { x: -1.45, z: -4.87 },
  { x: -0.72, z: -4.87 },
  { x: -0.27, z: -4.80 },
  { x:  0.46, z: -4.80 },
  { x:  0.85, z: -4.81 },
  { x:  1.52, z: -4.81 },
];

const luzNichosLights = [];
luzNichos.forEach(pos => {
  const spot = new THREE.PointLight(0xfff5e0, 3.5, 4);
  spot.position.set(pos.x, 1, pos.z);
  scene.add(spot);
  luzNichosLights.push(spot);

  /*const dbg = new THREE.Mesh(
    new THREE.SphereGeometry(0.1),
    new THREE.MeshBasicMaterial({ color: 0xffff00 })
  );
  dbg.position.copy(spot.position);
  scene.add(dbg);*/
});

document.getElementById('global-intensidad').addEventListener('input', e=>{
  const v=parseFloat(e.target.value);
  ambientLight.intensity=v*0.15; hemiLight.intensity=v*0.2;
  renderer.toneMappingExposure=0.8+v*0.18;
  scene.traverse(n=>{ if(n.isMesh&&n.material&&n!==fondoDome){ n.material.envMapIntensity=v*0.3; n.material.needsUpdate=true; }});
});
document.getElementById('nichos-intensidad').addEventListener('input', e=>{
  const v = parseFloat(e.target.value);
  document.getElementById('lbl-nichos').textContent = v.toFixed(1);
  luzNichosLights.forEach(l => l.intensity = v);
});
const GEO_TARGETS=['oversize_base_GEO','oversize_stitches_GEO','hoddie_GEO','hoddie__stitchesBase_GEO','stitchesHood_GEO','BigW_base_GEO','BigW_stitches_M','BigW_stitchesButton_M'];
const esTargetColor = n => GEO_TARGETS.includes(n) || /Cuero_GEO|Stitches_GEO|Tela_GEO|Cuero_1_GEO|Cuero_2_GEO/.test(n);
const PALETAS={
  'Oversize_W':[[13,13,13],[38,9,93],[24,20,17],[52,43,64]],
  'BigW':[[51,52,45],[55,52,52],[46,33,53],[43,43,54]],
  'Hoddie_GRP':[[23,26,100],[149,58,182],[13,13,13],[107,29,170]],
  'Mocasin_Izq':[[53,59,92],[69,46,28],[43,53,38],[71,13,21]],
  'BolsoVelez':[
    { c1:[86,48,45], c2:[27,20,17] },
    { c1:[0,0,0],    c2:[0,0,0]   },
    { c1:[140,93,57],c2:[30,19,14]}
  ]
};

function aplicarColor(r,g,b, r2,g2,b2){
  if(!prendaActiva) return;
  const color1 = new THREE.Color(r/255,g/255,b/255);
  const color2 = r2!==undefined ? new THREE.Color(r2/255,g2/255,b2/255) : color1;
  const esC2 = n => /Cuero_2/i.test(n.name);
  const pintar = obj => obj.traverse(n=>{
    if(!n.isMesh) return;
    if(esTargetColor(n.name)){
      n.material.color.set(esC2(n) ? color2 : color1);
      n.material.needsUpdate=true;
    }
  });
  let raiz = prendaActiva;
  while(raiz.parent && raiz.parent.type !== 'Scene') raiz = raiz.parent;
  pintar(raiz);
  if(prendaActiva.name==='Mocasin_Izq'){
    scene.traverse(n=>{ if(n.name==='Mocasin_Der') pintar(n); });
  }
}
function mostrarPaleta(clave){
  const sec=document.getElementById('color-section');
  const tit=document.getElementById('color-titulo');
  const sw=document.getElementById('color-swatches');
  const pal=PALETAS[clave];
  if(!pal){ sec.style.display='none'; return; }
  tit.textContent=({Hoddie_GRP:'Hoddie Colors',Oversize_W:'Oversize Colors',BigW:'BigW Colors',Mocasin_Izq:'Mocasin Colors',BolsoVelez:'Bolso Colors'})[clave]||'Colores';
  sw.innerHTML='';
  const esBolso = Array.isArray(pal[0]) === false;
  pal.forEach((entry,i)=>{
    const btn = document.createElement('div');
    if(esBolso){
      // Swatch partido: mitad c1, mitad c2
      const [r1,g1,b1] = entry.c1;
      const [r2,g2,b2] = entry.c2;
      btn.style.cssText=`width:32px;height:32px;border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,0.15);transition:border-color 0.2s;display:flex;`;
      btn.innerHTML=`<div style="flex:1;background:rgb(${r1},${g1},${b1})"></div><div style="flex:1;background:rgb(${r2},${g2},${b2})"></div>`;
      btn.title=`rgb(${r1},${g1},${b1}) / rgb(${r2},${g2},${b2})`;
      btn.addEventListener('mouseenter',()=>btn.style.borderColor='rgba(255,255,255,0.6)');
      btn.addEventListener('mouseleave',()=>btn.style.borderColor='rgba(255,255,255,0.15)');
      btn.addEventListener('click',()=>aplicarColor(r1,g1,b1,r2,g2,b2));
    } else {
      const [r,g,b]=entry;
      btn.style.cssText=`width:32px;height:32px;border-radius:6px;background:rgb(${r},${g},${b});cursor:pointer;border:2px solid rgba(255,255,255,0.15);transition:border-color 0.2s;`;
      btn.title=`rgb(${r},${g},${b})`;
      btn.addEventListener('mouseenter',()=>btn.style.borderColor='rgba(255,255,255,0.6)');
      btn.addEventListener('mouseleave',()=>btn.style.borderColor='rgba(255,255,255,0.15)');
      btn.addEventListener('click',()=>aplicarColor(r,g,b));
    }
    sw.appendChild(btn);
  });
  sec.style.display='block';
}

// ── Loaders ────────────────────────────────────────────────────────────────────
const dracoLoader=new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
const gltfLoader=new THREE.GLTFLoader(); gltfLoader.setDRACOLoader(dracoLoader);

// ── Estado prendas ─────────────────────────────────────────────────────────────
let vestierRoot=null;
const PRENDAS=['Hoddie_GRP','Oversize_W','BigW','Mocasin_Izq','BolsoVelez'];
let prendaActiva=null, posOriginalLocal=new THREE.Vector3(), rotOriginalLocal=new THREE.Quaternion();
let animando=false, modoDetalle=false, lastTapTime=0, lastTapObj=null;
let centroPrendaMundo=new THREE.Vector3(), posDestinoLocal=new THREE.Vector3();
const hintEl=document.getElementById('hint');

function animarHacia(obj,dest,dur,onDone,rotDest){
  const p0=obj.position.clone(), r0=obj.quaternion.clone().normalize();
  const r1=rotDest?rotDest.clone().normalize():r0.clone();
  if(r0.dot(r1)<0) r1.set(-r1.x,-r1.y,-r1.z,-r1.w);
  const t0=performance.now();
  (function step(now){
    const t=Math.min((now-t0)/dur,1), e=t<0.5?2*t*t:-1+(4-2*t)*t;
    obj.position.lerpVectors(p0,dest,e);
    obj.quaternion.slerpQuaternions(r0,r1,e);
    if(t<1) requestAnimationFrame(step); else if(onDone) onDone();
  })(performance.now());
}

function getDestinoLocal(prenda){
  prenda.updateWorldMatrix(true,true);
  const box=new THREE.Box3().setFromObject(prenda);
  const centro=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  const pivot=new THREE.Vector3(); prenda.getWorldPosition(pivot);
  const offset=centro.clone().sub(pivot);
  const fovR=camera.fov*Math.PI/180;
  const dist=(maxDim*1.5)/(2*Math.tan(fovR/2));
  camera.updateMatrixWorld();
  const destCentro=new THREE.Vector3(0,0,-dist).applyMatrix4(camera.matrixWorld);
  const newPivot=destCentro.clone().sub(offset);
  const padre=prenda.parent;
  if(padre&&padre.type!=='Scene') newPivot.applyMatrix4(new THREE.Matrix4().copy(padre.matrixWorld).invert());
  return newPivot;
}

const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
let pointerStart={x:0,y:0}, pointerDownTime=0, isDragging=false, lastPointerX=0;
const ROT_SPEED=0.012;

renderer.domElement.addEventListener('pointerdown', e=>{
  pointerDownTime=Date.now(); pointerStart={x:e.clientX,y:e.clientY};
  lastPointerX=e.clientX; isDragging=false;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(!modoDetalle||!prendaActiva||animando) return;
  if(e.pointerType==='mouse'&&!(e.buttons&1)) return;
  const dx=e.clientX-pointerStart.x;
  if(!isDragging&&Math.abs(dx)>6) isDragging=true;
  if(isDragging){
    const delta=(e.clientX-lastPointerX)*ROT_SPEED;
    const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),delta);
    prendaActiva.position.sub(centroPrendaMundo);
    prendaActiva.position.applyQuaternion(q);
    prendaActiva.quaternion.premultiply(q);
    prendaActiva.position.add(centroPrendaMundo);
  }
  lastPointerX=e.clientX;
});
renderer.domElement.addEventListener('pointerup', e=>{
  const moved=Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y);
  const elapsed=Date.now()-pointerDownTime;
  if(isDragging||moved>10||elapsed>400){ isDragging=false; return; }
  isDragging=false;
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(scene.children.filter(o=>o!==fondoDome),true);
  if(!hits.length) return;
  let nodo=hits[0].object, clave=null;
  while(nodo){ if(PRENDAS.includes(nodo.name)){ clave=nodo.name; break; } nodo=nodo.parent; }
  if(!clave) return;
  const ahora=Date.now();
  const doble=(clave===lastTapObj)&&(ahora-lastTapTime<500);
  lastTapTime=ahora; lastTapObj=clave;
  if(animando) return;
  if(doble&&modoDetalle&&prendaActiva?.name===clave){
    animando=true; controls.enabled=false; hintEl.classList.remove('visible');
    prendaActiva.quaternion.copy(rotOriginalLocal);
    prendaActiva.position.copy(posDestinoLocal);
    animarHacia(prendaActiva,posOriginalLocal,500,()=>{
      modoDetalle=false; animando=false; controls.enabled=false; prendaActiva=null;
      document.getElementById('color-section').style.display='none';
    },rotOriginalLocal);
    return;
  }
  if(!modoDetalle){
    scene.traverse(n=>{ if(n.name===clave) prendaActiva=n; });
    if(!prendaActiva) return;
    posOriginalLocal.copy(prendaActiva.position);
    rotOriginalLocal.copy(prendaActiva.quaternion);
    const dest=getDestinoLocal(prendaActiva);
    modoDetalle=true; animando=true; controls.enabled=false;
camera.updateMatrixWorld();
const camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
camDir.y = 0; camDir.normalize();
if (clave === 'Oversize_W' || clave === 'Mocasin_Izq' || clave === 'BolsoVelez') {
  animarHacia(prendaActiva, dest, 600, ()=>{
    animando=false; controls.enabled=false; hintEl.classList.add('visible');
    mostrarPaleta(clave);
    posDestinoLocal=prendaActiva.position.clone();
    new THREE.Box3().setFromObject(prendaActiva).getCenter(centroPrendaMundo);
  });
} else {
  const intermedio = posOriginalLocal.clone().addScaledVector(camDir, posOriginalLocal.distanceTo(dest) * -0.08);
  animarHacia(prendaActiva, intermedio, 450, ()=>{
    animarHacia(prendaActiva, dest, 700, ()=>{
      animando=false; controls.enabled=false; hintEl.classList.add('visible');
      mostrarPaleta(clave);
      posDestinoLocal=prendaActiva.position.clone();
      new THREE.Box3().setFromObject(prendaActiva).getCenter(centroPrendaMundo);
    });
  });
}
  }
});

function onVestierLoad(gltf){
  const root=gltf.scene; scene.add(root); vestierRoot=root;
  const box=new THREE.Box3().setFromObject(root);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  camera.near=maxDim/20; camera.far=maxDim*4; camera.updateProjectionMatrix();
  controls.enabled=false;
  bgBase.origin.copy(center); bgBase.height=Math.max(0.01,center.y-box.min.y); bgBase.maxDim=maxDim;
  if(fondoDome) fondoDome.scale.setScalar(maxDim*2);
  actualizarFondo();
  document.getElementById('loading').style.display='none';
  if(document.getElementById('hdri-fondo').checked) vestierRoot.visible=false;
}
function cargarVestier(n=3){
  gltfLoader.load('Models/vestier.glb', onVestierLoad,
    xhr=>{ if(xhr.lengthComputable) document.getElementById('loading').textContent=`Cargando modelo… ${Math.round(xhr.loaded/xhr.total*100)}%`; },
    err=>{ if(n>0){ setTimeout(()=>cargarVestier(n-1),800); } else { console.error('[Room]',err); document.getElementById('loading').textContent='Error al cargar Models/vestier.glb'; }});
}
cargarVestier();

gltfLoader.load('Models/Camera_03.glb', gltf=>{
  const camGLB=gltf.cameras[0]; if(!camGLB) return;
  gltf.scene.updateMatrixWorld(true);
  const pos=new THREE.Vector3(),quat=new THREE.Quaternion(),esc=new THREE.Vector3();
  camGLB.matrixWorld.decompose(pos,quat,esc);
  camFovBase=camGLB.fov; camera.fov=camGLB.fov;
  camera.position.copy(pos); camera.quaternion.copy(quat);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld(); ajustarFovCamara();
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(quat);
  controls.target.copy(pos).addScaledVector(dir,2.872);
  controls.minPolarAngle=0; controls.maxPolarAngle=Math.PI;
  controls.minAzimuthAngle=-Infinity; controls.maxAzimuthAngle=Infinity;
  controls.update(); controls.enabled=false; controls.dispose();
}, undefined, e=>console.error('[Camara.glb]',e));

function cargarPrenda(path,names,color){ gltfLoader.load(path, gltf=>{
  const root=gltf.scene; scene.add(root);
  root.traverse(n=>{ if(n.isMesh){
    n.material=n.material.clone(); n.material.metalness=0; n.material.roughness=0.85; n.material.envMapIntensity=0.3;
    if(n.material.map) n.material.map.encoding=THREE.sRGBEncoding;
    if(names.includes(n.name)) n.material.color.set(color);
    n.material.needsUpdate=true;
  }});
}, undefined, e=>console.error(`[${path}]`,e)); }

function pintarInicial(obj, tipo){
  obj.traverse(n=>{
    if(!n.isMesh || !esTargetColor(n.name)) return;
    if(tipo === 'bolso'){
      const esC2 = /Cuero_2/i.test(n.name);
      n.material.color.copy(esC2 ? COLOR_INICIAL_BOLSO_C2 : COLOR_INICIAL_BOLSO_C1);
    } else {
      n.material.color.copy(COLOR_INICIAL_MOCASIN);
    }
    n.material.needsUpdate=true;
  });
}

// ══════════════════════════════════════════════════════════════════════════════
//  PIPELINE AO — render separado de prendas → mapa AO → canvas 2D overlay
// ══════════════════════════════════════════════════════════════════════════════

// Escena auxiliar que solo contiene las prendas (no el fondo, no el vestier)
const sceneAO = new THREE.Scene();

// RT con depth texture para el pase AO
let rtPrendas = null;

function buildAOTargets(w, h){
  if(rtPrendas) rtPrendas.dispose();
  rtPrendas = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    format: THREE.RGBAFormat,
    depthBuffer: true, stencilBuffer: false,
    depthTexture: new THREE.DepthTexture(w, h, THREE.UnsignedIntType)
  });
}
buildAOTargets(window.innerWidth, window.innerHeight);

// RT normal de prendas
let rtNormals = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, format: THREE.RGBAFormat
});

// RT mapa AO crudo y blurs
let rtAO_raw  = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat });
let rtAO_blH  = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat });
let rtAO_blV  = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, format:THREE.RGBAFormat });

function resizeAOTargets(w,h){
  rtPrendas.dispose(); buildAOTargets(w,h);
  [rtNormals,rtAO_raw,rtAO_blH,rtAO_blV].forEach(rt=>rt.setSize(w,h));
}

// Material normales
const normalMat = new THREE.ShaderMaterial({
  vertexShader:  `varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vN; void main(){ gl_FragColor=vec4(vN*0.5+0.5,1.0); }`
});

// Material AO
const aoMat = new THREE.ShaderMaterial({
  uniforms:{
    tDepth:{value:null}, tNormal:{value:null}, uSize:{value:new THREE.Vector2(1,1)},
    uRadius:{value:0.15}, uBias:{value:0.025}, uIntensity:{value:1.0}, uSamples:{value:16},
    cameraNear:{value:0.1}, cameraFar:{value:1000},
    projMatrix:{value:new THREE.Matrix4()}, invProjMatrix:{value:new THREE.Matrix4()}
  },
  vertexShader:SSAO_VERT, fragmentShader:SSAO_FRAG
});

// Material blur
const blurMatH = new THREE.ShaderMaterial({
  uniforms:{ tAO:{value:null}, uSize:{value:new THREE.Vector2(1,1)}, uDir:{value:new THREE.Vector2(1,0)} },
  vertexShader:BLUR_VERT, fragmentShader:BLUR_FRAG
});
const blurMatV = new THREE.ShaderMaterial({
  uniforms:{ tAO:{value:null}, uSize:{value:new THREE.Vector2(1,1)}, uDir:{value:new THREE.Vector2(0,1)} },
  vertexShader:BLUR_VERT, fragmentShader:BLUR_FRAG
});

// Quad fullscreen para shader passes
const quadScene = new THREE.Scene();
const quadCam   = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quadMesh  = new THREE.Mesh(new THREE.PlaneGeometry(2,2), aoMat);
quadScene.add(quadMesh);

function renderQuad(mat, target){
  quadMesh.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, quadCam);
}

// Canvas 2D overlay
const aoCanvas = document.getElementById('ao-canvas');
const aoCtx    = aoCanvas.getContext('2d');
function resizeAOCanvas(w,h){ aoCanvas.width=w; aoCanvas.height=h; aoCanvas.style.width=w+'px'; aoCanvas.style.height=h+'px'; }
resizeAOCanvas(window.innerWidth, window.innerHeight);

// Buffer para leer pixels del RT AO
let aoPixels = new Uint8Array(window.innerWidth * window.innerHeight * 4);

// ── Estado AO ─────────────────────────────────────────────────────────────────
const aoState = { enabled:false, onlyAO:false, radius:6, intensity:1.0, samples:16 };

// ── Actualizar etiquetas ───────────────────────────────────────────────────────
document.getElementById('ao-toggle').addEventListener('change', e=>{ aoState.enabled=e.target.checked; if(!e.target.checked){ aoCanvas.style.display='none'; }});
document.getElementById('ao-radius').addEventListener('input',   e=>{ aoState.radius=parseFloat(e.target.value); document.getElementById('lbl-radius').textContent=aoState.radius.toFixed(1); });
document.getElementById('ao-intensity').addEventListener('input', e=>{ aoState.intensity=parseFloat(e.target.value); document.getElementById('lbl-intensity').textContent=aoState.intensity.toFixed(2); });
document.getElementById('ao-samples').addEventListener('input',   e=>{ aoState.samples=parseInt(e.target.value); document.getElementById('lbl-samples').textContent=aoState.samples; });
document.getElementById('ao-only').addEventListener('change',     e=>{ aoState.onlyAO=e.target.checked; });

// ── Función principal AO ──────────────────────────────────────────────────────
//   Recoge las prendas de la escena principal, las renderiza solas,
//   calcula AO y vuelca el resultado en el canvas 2D overlay.
function renderAO() {
  const W = window.innerWidth, H = window.innerHeight;

  // Recolectar meshes de prendas (excluye fondoDome y vestierRoot)
  const meshes = [];
  scene.traverse(n => {
    if (!n.isMesh) return;
    if (n === fondoDome) return;
    // Excluir meshes del vestier (están dentro de vestierRoot)
    let anc = n.parent;
    let esVestier = false;
    while (anc){ if(anc===vestierRoot){ esVestier=true; break; } anc=anc.parent; }
    if (!esVestier) meshes.push(n);
  });

  if (meshes.length === 0) return;

  // ── 1. Render de normales (solo prendas) ──────────────────────────────────
  const savedMats = new Map();
  meshes.forEach(m => { savedMats.set(m, m.material); m.material = normalMat; });
  // Mover meshes a sceneAO temporalmente
  const savedParents = new Map();
  meshes.forEach(m => { savedParents.set(m, m.parent); sceneAO.attach(m); });
  renderer.setRenderTarget(rtNormals);
  renderer.clearColor(); renderer.clearDepth();
  renderer.render(sceneAO, camera);
  // Devolver meshes a su lugar y restaurar materiales
  meshes.forEach(m => { const p = savedParents.get(m); if(p) p.attach(m); m.material = savedMats.get(m); });

  // ── 2. Render de color + depth (solo prendas — sin fondo) ─────────────────
  //   Ocultamos temporalmente el fondo y el vestier
  const savedFondoVisible  = fondoDome ? fondoDome.visible  : false;
  const savedVestierVisible= vestierRoot ? vestierRoot.visible : false;
  const savedBG = scene.background;
  if(fondoDome)    fondoDome.visible   = false;
  if(vestierRoot)  vestierRoot.visible = false;
  scene.background = null;

  renderer.setRenderTarget(rtPrendas);
  renderer.setClearColor(0x000000, 0);
  renderer.clearColor(); renderer.clearDepth();
  renderer.render(scene, camera);

  // Restaurar visibilidad
  if(fondoDome)   fondoDome.visible   = savedFondoVisible;
  if(vestierRoot) vestierRoot.visible = savedVestierVisible;
  scene.background = savedBG;

  // ── 3. Shader AO ──────────────────────────────────────────────────────────
  const u = aoMat.uniforms;
  u.tDepth.value   = rtPrendas.depthTexture;
  u.tNormal.value  = rtNormals.texture;
  u.uSize.value.set(W,H);
  u.uRadius.value   = aoState.radius;
  u.uIntensity.value= aoState.intensity;
  u.uSamples.value  = aoState.samples;
  u.uBias.value     = 0.025;
  u.cameraNear.value= camera.near;
  u.cameraFar.value = camera.far;
  u.projMatrix.value.copy(camera.projectionMatrix);
  u.invProjMatrix.value.copy(camera.projectionMatrixInverse);
  renderQuad(aoMat, rtAO_raw);

  // ── 4. Blur ────────────────────────────────────────────────────────────────
  blurMatH.uniforms.tAO.value = rtAO_raw.texture;
  blurMatH.uniforms.uSize.value.set(W,H);
  renderQuad(blurMatH, rtAO_blH);

  blurMatV.uniforms.tAO.value = rtAO_blH.texture;
  blurMatV.uniforms.uSize.value.set(W,H);
  renderQuad(blurMatV, rtAO_blV);

  renderer.setRenderTarget(null);

  // ── 5. Leer pixels y dibujar en canvas 2D ────────────────────────────────
  if (aoPixels.length !== W * H * 4) aoPixels = new Uint8Array(W * H * 4);

  renderer.readRenderTargetPixels(rtAO_blV, 0, 0, W, H, aoPixels);

  aoCanvas.style.display = 'block';

  if (aoState.onlyAO) {
    // Modo debug: mostrar solo el mapa AO (blanco=libre, negro=ocluido)
    // Sin blend-mode multiplicativo — canvas opaco sobre todo
    aoCanvas.style.mixBlendMode = 'normal';
    aoCanvas.style.opacity = '1';
    const id = aoCtx.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      const v = aoPixels[(H - 1 - Math.floor(i / W)) * W * 4 + (i % W) * 4]; // Y flip
      id.data[i*4]   = v;
      id.data[i*4+1] = v;
      id.data[i*4+2] = v;
      id.data[i*4+3] = 255;
    }
    aoCtx.putImageData(id, 0, 0);
  } else {
    // Modo normal: sombra negra semitransparente solo donde hay oclusión
    aoCanvas.style.mixBlendMode = 'normal';
    aoCanvas.style.opacity = '1';
    const id = aoCtx.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      const row = H - 1 - Math.floor(i / W);
      const col = i % W;
      const v   = aoPixels[row * W * 4 + col * 4];
      id.data[i*4]   = 0;
      id.data[i*4+1] = 0;
      id.data[i*4+2] = 0;
      // v=255 libre → alpha 0 (invisible), v=0 ocluido → alpha 255 (negro)
      id.data[i*4+3] = 255 - v;
    }
    aoCtx.putImageData(id, 0, 0);
  }
}

// ── Loop de render ─────────────────────────────────────────────────────────────
(function animate(){
  requestAnimationFrame(animate);
  camera.updateMatrixWorld();
  if(fondoDome) fondoDome.position.copy(camera.position);

  // Render principal normal (sin tocar el pipeline)
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

  // AO encima
  if(aoState.enabled) renderAO();
  else if(aoCanvas.style.display !== 'none') aoCanvas.style.display='none';
})();

// ── Resize ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{
  const W=window.innerWidth, H=window.innerHeight;
  ajustarFovCamara();
  renderer.setSize(W,H);
  resizeAOTargets(W,H);
  resizeAOCanvas(W,H);
});
</script>
