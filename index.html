<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor 3D</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; }

#loading {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  color: #ddd; font-family: sans-serif; font-size: 16px;
  text-align: center; pointer-events: none; z-index: 10;
}

#panel-derecho {
  position: absolute; top: 16px; right: 16px;
  background: rgba(15,15,15,0.88);
  backdrop-filter: blur(8px);
  color: #ccc; font-family: 'Segoe UI', sans-serif; font-size: 12px;
  padding: 16px; border-radius: 12px; width: 180px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);

}
#panel-derecho h3 {
  margin: 0 0 8px 0; font-size: 11px; color: #888;
  text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 6px;
}
#panel-derecho label {
  display: block; margin-top: 8px; margin-bottom: 4px;
  color: #aaa; font-size: 11px;
}
#panel-derecho input[type="range"] {
  width: 100%; accent-color: #fff; height: 3px; cursor: pointer;
}

#hint {
  position: absolute; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.55);
  color: #ddd; font-family: 'Segoe UI', sans-serif; font-size: 12px;
  padding: 6px 16px; border-radius: 20px;
  pointer-events: none; opacity: 0;
  transition: opacity 0.4s;
  z-index: 20;
}
#hint.visible { opacity: 1; }
</style>
</head>

<div id="panel-derecho">

  <label>Intensidad</label>
  <input type="range" id="global-intensidad" min="0" max="5" step="0.05" value="1">
<label style="margin-top:14px;">HDRI</label>
<select id="hdri-select" style="width:100%; background:#1a1a1a; color:#ccc;

<script>
'use strict';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.physicallyCorrectLights = true;
renderer.outputEncoding  = THREE.sRGBEncoding;
renderer.toneMapping     = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.domElement.style.touchAction = 'none';
document.body.appendChild(renderer.domElement);

// ── Escena ────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b2b2b);

// POR esto:
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envTexture = null;

// REEMPLAZA toda la función cargarHDRI y la declaración de bgTexture

let bgTexture = null;

function cargarHDRI(nombre) {
  const loader = new THREE.RGBELoader().setPath('Hdri/');

  loader.load(nombre + '.hdr', (hdr) => {
    if (envTexture) envTexture.dispose();
    envTexture = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose();
    scene.environment = envTexture;

    scene.traverse((n) => {
      if (n.isMesh && n.material) {
        n.material.envMap = envTexture;
        n.material.needsUpdate = true;
      }
    });
  },
  undefined,
  (err) => console.error('[HDRI env] ERROR:', err));
}
cargarHDRI('studio016');

document.getElementById('hdri-select').addEventListener('change', (e) => {
  cargarHDRI(e.target.value);
});

// REEMPLAZA el listener del checkbox completo
// ── Fondo: imagen Vestier_v001.png con proyección al piso ─────────────────────
// La imagen es 4096x1024 y tiene el panorama repetido 2 veces,
// por eso solo se usa la mitad (BG_REPEAT_X = 0.5). Si se ve cortado, pon 1.0
const BG_IMAGE_PATH = 'Backgrounds/Vestier_v001.png';
const BG_REPEAT_X   = 0.5;

let fondoDome = null;
const bgBase = { origin: new THREE.Vector3(), height: 1, maxDim: 1 };

const fondoVertex = `
  varying vec3 vDir;
  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vDir = wp.xyz - cameraPosition;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const fondoFragment = `
  uniform sampler2D map;
  uniform vec3  uOrigin;
  uniform float uHeight;
  uniform float uRadius;
  uniform float uRot;
  uniform float uRepeat;
  varying vec3 vDir;
  const float PI = 3.14159265359;

  void main() {
    vec3 d   = normalize(vDir);
    vec3 cam = cameraPosition - uOrigin;

    float b    = dot(cam, d);
    float c    = dot(cam, cam) - uRadius * uRadius;
    float disc = b * b - c;

    vec3 p = d;
    if (disc > 0.0 && c < 0.0) {
      float t = -b + sqrt(disc);
      if (d.y < -0.0001) {
        float tp = (-uHeight - cam.y) / d.y;
        if (tp > 0.0) t = min(t, tp);
      }
      p = cam + t * d;
    }
    p = normalize(p);

    float u = atan(p.z, p.x) / (2.0 * PI) + 0.5 + uRot;
    float v = asin(clamp(p.y, -1.0, 1.0)) / PI + 0.5;
    u = fract(u) * uRepeat;

    gl_FragColor = vec4(texture2D(map, vec2(u, v)).rgb, 1.0);
  }
`;

function crearFondoDome() {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      map:     { value: null },
      uOrigin: { value: new THREE.Vector3() },
      uHeight: { value: 1 },
      uRadius: { value: 10 },
      uRot:    { value: 0 },
      uRepeat: { value: BG_REPEAT_X }
    },
    vertexShader:   fondoVertex,
    fragmentShader: fondoFragment,
    side: THREE.BackSide,
    depthTest: false,
    depthWrite: false
  });

  fondoDome = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), mat);
  fondoDome.frustumCulled = false;
  fondoDome.renderOrder   = -1000;
  fondoDome.visible       = false;
  scene.add(fondoDome);

  new THREE.TextureLoader().load(BG_IMAGE_PATH, (tex) => {
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    mat.uniforms.map.value = tex;
  }, undefined, (err) => console.error('[Fondo] No se pudo cargar', BG_IMAGE_PATH, err));
}
crearFondoDome();

function actualizarFondo() {
  if (!fondoDome) return;
  const u = fondoDome.material.uniforms;
  const piso  = parseFloat(document.getElementById('fondo-piso').value);
  const radio = parseFloat(document.getElementById('fondo-radio').value);
  const rot   = parseFloat(document.getElementById('fondo-rot').value);

  u.uOrigin.value.copy(bgBase.origin);
  u.uHeight.value = Math.max(0.01, bgBase.height + piso * bgBase.maxDim);
  u.uRadius.value = bgBase.maxDim * radio;
  u.uRot.value    = rot / 360;
}

['fondo-piso', 'fondo-radio', 'fondo-rot'].forEach((id) => {
  document.getElementById(id).addEventListener('input', actualizarFondo);
});

document.getElementById('hdri-fondo').addEventListener('change', (e) => {
  const on = e.target.checked;
  if (fondoDome)   fondoDome.visible   = on;
  if (vestierRoot) vestierRoot.visible = !on;
  document.getElementById('fondo-ajustes').style.display = on ? 'block' : 'none';
  if (on) actualizarFondo();
});
// ── Cámara ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.name = 'CamaraPrincipal';
camera.position.set(4, 3, 6);

// ── Controles ─────────────────────────────────────────────────────────────────
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan     = false;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.minAzimuthAngle = -Math.PI / 20;
controls.maxAzimuthAngle =  Math.PI / 2;
controls.maxPolarAngle   =  Math.PI / 2 - 0.05;
controls.minPolarAngle   =  0.7;

// ── Iluminación ───────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
const hemiLight    = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
scene.add(ambientLight, hemiLight);

document.getElementById('global-intensidad').addEventListener('input', (e) => {
  const v = parseFloat(e.target.value);
  ambientLight.intensity       = v * 0.15;
  hemiLight.intensity          = v * 0.2;
  renderer.toneMappingExposure = 0.8 + v * 0.18;
  // AGREGAR ESTO ↓
  scene.traverse((n) => {
        if (n.isMesh && n.material && n !== fondoDome) {
      n.material.envMapIntensity = v * 0.3;
      n.material.needsUpdate = true;
    }
  });
});

const GEO_TARGETS = [
  'oversize_base_GEO', 'oversize_stitches_GEO',
  'hoddie_GEO', 'hoddie__stitchesBase_GEO', 'stitchesHood_GEO',
  'BigW_base_GEO', 'BigW_stitches_M', 'BigW_stitchesButton_M'
];

const PALETAS = {
  'Oversize_W': [
    [13,13,13], [38,9,93], [24,20,17], [52,43,64]
  ],
  'BigW': [
    [51,52,45], [55,52,52], [46,33,53], [43,43,54]
  ],
  'Hoddie_GRP': [
    [23,26,100], [149,58,182], [13,13,13], [107,29,170]
  ]
};

function aplicarColor(r, g, b) {
  if (!prendaActiva) return;
  const color = new THREE.Color(r/255, g/255, b/255);
  prendaActiva.traverse((n) => {
    if (n.isMesh && GEO_TARGETS.includes(n.name)) {
      n.material.color.set(color);
      n.material.needsUpdate = true;
    }
  });
}

function mostrarPaleta(clave) {
  const section  = document.getElementById('color-section');
  const titulo   = document.getElementById('color-titulo');
  const swatches = document.getElementById('color-swatches');
  const paleta   = PALETAS[clave];

  if (!paleta) { section.style.display = 'none'; return; }

  titulo.textContent = clave === 'Hoddie_GRP' ? 'Hoddie Colors'
                     : clave === 'Oversize_W'  ? 'Oversize Colors'
                     : 'BigW Colors';

  swatches.innerHTML = '';
  paleta.forEach(([r, g, b]) => {
    const btn = document.createElement('div');
    btn.style.cssText = `
      width: 32px; height: 32px; border-radius: 6px;
      background: rgb(${r},${g},${b});
      cursor: pointer; border: 2px solid rgba(255,255,255,0.15);
      transition: border-color 0.2s;
    `;
    btn.title = `rgb(${r}, ${g}, ${b})`;
    btn.addEventListener('mouseenter', () => btn.style.borderColor = 'rgba(255,255,255,0.6)');
    btn.addEventListener('mouseleave', () => btn.style.borderColor = 'rgba(255,255,255,0.15)');
    btn.addEventListener('click', () => aplicarColor(r, g, b));
    swatches.appendChild(btn);
  });

  section.style.display = 'block';
}

// ── Loaders ───────────────────────────────────────────────────────────────────
const dracoLoader = new THREE.DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');

const gltfLoader = new THREE.GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// ── Estado de prendas ─────────────────────────────────────────────────────────
let vestierRoot = null;
const PRENDAS = ['Hoddie_GRP', 'Oversize_W', 'BigW'];
let prendaActiva    = null;
let posOriginalLocal  = new THREE.Vector3();
let rotOriginalLocal  = new THREE.Quaternion();
let animando        = false;
let modoDetalle     = false;
let lastTapTime     = 0;
let lastTapObj      = null;
let centroPrendaMundo = new THREE.Vector3();
let posDestinoLocal = new THREE.Vector3(); // ← AGREGAR ESTA LÍNEA
const hintEl        = document.getElementById('hint');

// ── Animación easeInOut ───────────────────────────────────────────────────────
function animarHacia(objeto, destino, duracion, onComplete, rotDestino) {
  const posInicio = objeto.position.clone();
  const rotInicio = objeto.quaternion.clone().normalize();
  const rotFin    = rotDestino ? rotDestino.clone().normalize() : rotInicio.clone();

  if (rotInicio.dot(rotFin) < 0) {
    rotFin.set(-rotFin.x, -rotFin.y, -rotFin.z, -rotFin.w);
  }

  const startT = performance.now();
  function step(now) {
    const t = Math.min((now - startT) / duracion, 1);
    const e = t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
    objeto.position.lerpVectors(posInicio, destino, e);
    objeto.quaternion.slerpQuaternions(rotInicio, rotFin, e);
    if (t < 1) requestAnimationFrame(step);
    else if (onComplete) onComplete();
  }
  requestAnimationFrame(step);
}

// ── Cálculo de destino corregido ──────────────────────────────────────────────
//
// Problema anterior: se movía el pivot del objeto sin tener en cuenta que
// el centro visual (bounding box center) puede estar desplazado del pivot.
//
// Solución:
//  1. Calculamos el centro real del bounding box en espacio mundo.
//  2. Calculamos el offset entre el pivot y ese centro (constante durante la animación).
//  3. Determinamos dónde queremos que aparezca el CENTRO visual, usando el FOV
//     de la cámara para asegurar que la prenda quede bien encuadrada.
//  4. El nuevo pivot = destinoCentro − offset, convertido al espacio del padre.
//
function getDestinoLocal(prenda) {
  // 1. Forzar actualización de matrices antes de leer
  prenda.updateWorldMatrix(true, true);

  // 2. Bounding box en espacio mundo → centro y tamaño reales
  const box = new THREE.Box3().setFromObject(prenda);
  const centroMundo = box.getCenter(new THREE.Vector3());
  const size        = box.getSize(new THREE.Vector3());
  const maxDim      = Math.max(size.x, size.y, size.z);

  // 3. Pivot actual en espacio mundo
  const pivotMundo = new THREE.Vector3();
  prenda.getWorldPosition(pivotMundo);

  // 4. Offset pivot → centro (en espacio mundo, constante)
  const offset = centroMundo.clone().sub(pivotMundo);

  // 5. Distancia cámara-objeto para que la prenda llene ~65% de la pantalla
  //    Usamos el FOV vertical: d = (alto / 2) / tan(fov/2)
  //    "alto" = maxDim * factor_de_relleno
  const fovRad    = camera.fov * Math.PI / 180;
  const distancia = (maxDim * 1.5) / (2 * Math.tan(fovRad / 2));

  // 6. Punto destino del CENTRO en espacio local de cámara (eje -Z = adelante)
  //    Lo pasamos a espacio mundo con la matriz mundo de la cámara
  camera.updateMatrixWorld();
  const localCam          = new THREE.Vector3(0, 0, -distancia);
  const destinoCentroMundo = localCam.applyMatrix4(camera.matrixWorld);

  // 7. Nuevo pivot mundo = destinoCentro − offset
  const nuevoPivotMundo = destinoCentroMundo.clone().sub(offset);

  // 8. Convertir al espacio local del padre
  const padre = prenda.parent;
  if (padre && padre.type !== 'Scene') {
    const inv = new THREE.Matrix4().copy(padre.matrixWorld).invert();
    nuevoPivotMundo.applyMatrix4(inv);
  }

  return nuevoPivotMundo;
}

// ── Raycast ───────────────────────────────────────────────────────────────────
const raycaster   = new THREE.Raycaster();
const mouse       = new THREE.Vector2();
let pointerStart    = { x: 0, y: 0 };
let pointerDownTime = 0;
let isDragging      = false;
let lastPointerX    = 0;
const ROT_SPEED     = 0.012;

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownTime = Date.now();
  pointerStart    = { x: e.clientX, y: e.clientY };
  lastPointerX    = e.clientX;
  isDragging      = false;
  renderer.domElement.setPointerCapture(e.pointerId);
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!modoDetalle || !prendaActiva || animando) return;
  if (e.pointerType === 'mouse' && !(e.buttons & 1)) return;

  const dx = e.clientX - pointerStart.x;
  if (!isDragging && Math.abs(dx) > 6) isDragging = true;

if (isDragging) {
  const delta = (e.clientX - lastPointerX) * ROT_SPEED;

  // Rotar sobre el centro real de la prenda (no sobre su pivot)
  const eje = new THREE.Vector3(0, 1, 0); // eje Y = gira de frente/espalda
  const q   = new THREE.Quaternion().setFromAxisAngle(eje, delta);

  // 1. Mover pivot al origen del centro
  prendaActiva.position.sub(centroPrendaMundo);
  // 2. Rotar posición
  prendaActiva.position.applyQuaternion(q);
  // 3. Rotar la orientación del objeto
  prendaActiva.quaternion.premultiply(q);
  // 4. Devolver al centro
  prendaActiva.position.add(centroPrendaMundo);
}
  lastPointerX = e.clientX;
});

renderer.domElement.addEventListener('pointerup', (e) => {
  const moved   = Math.hypot(e.clientX - pointerStart.x, e.clientY - pointerStart.y);
  const elapsed = Date.now() - pointerDownTime;
  if (isDragging || moved > 10 || elapsed > 400) { isDragging = false; return; }
  isDragging = false;

  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(scene.children.filter(o => o !== fondoDome), true);
  if (!hits.length) return;

  let nodo  = hits[0].object;
  let clave = null;
  while (nodo) {
    if (PRENDAS.includes(nodo.name)) { clave = nodo.name; break; }
    nodo = nodo.parent;
  }
  if (!clave) return;

  const ahora = Date.now();
  const doble = (clave === lastTapObj) && (ahora - lastTapTime < 500);
  lastTapTime = ahora;
  lastTapObj  = clave;

  if (animando) return;

  // ── Doble tap: regresar a posición original ───────────────────────────────
if (doble && modoDetalle && prendaActiva?.name === clave) {
  animando = true;
  controls.enabled = false;
  hintEl.classList.remove('visible');

  prendaActiva.quaternion.copy(rotOriginalLocal);
  prendaActiva.position.copy(posDestinoLocal);

  animarHacia(prendaActiva, posOriginalLocal, 500, () => {
    modoDetalle      = false;
    animando         = false;
    controls.enabled = false;
    prendaActiva     = null;
    document.getElementById('color-section').style.display = 'none';
  }, rotOriginalLocal);
  return;
}

  // ── Tap simple: llevar prenda al frente de la cámara ─────────────────────
  if (!modoDetalle) {
    scene.traverse((n) => { if (n.name === clave) prendaActiva = n; });
    if (!prendaActiva) return;

    posOriginalLocal.copy(prendaActiva.position);
rotOriginalLocal.copy(prendaActiva.quaternion);
    const destinoLocal = getDestinoLocal(prendaActiva);

    modoDetalle      = true;
    animando         = true;
    controls.enabled = false;

animarHacia(prendaActiva, destinoLocal, 700, () => {
  animando         = false;
  controls.enabled = false;
  hintEl.classList.add('visible');

  mostrarPaleta(clave);

  posDestinoLocal = prendaActiva.position.clone();

  const box = new THREE.Box3().setFromObject(prendaActiva);
  box.getCenter(centroPrendaMundo);
});
  }
});

// ── Cargar modelo ─────────────────────────────────────────────────────────────
function onVestierLoad(gltf) {
  const root = gltf.scene;
  scene.add(root);
  vestierRoot = root;

  console.log('=== Nodos del GLB ===');
  root.traverse((n) => {
    if (n.name) console.log(n.type, '→', n.name);
  });

  const box    = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  controls.target.copy(center);
  camera.near = maxDim / 20;
  camera.far  = maxDim * 4;
  camera.position.set(center.x, center.y, center.z + maxDim * 0.7);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  controls.update();
  controls.enabled = false;

  // Parámetros del fondo según el vestier
  bgBase.origin.copy(center);
  bgBase.height = Math.max(0.01, center.y - box.min.y);
  bgBase.maxDim = maxDim;
  if (fondoDome) fondoDome.scale.setScalar(maxDim * 2);
  actualizarFondo();

  document.getElementById('loading').style.display = 'none';

  if (document.getElementById('hdri-fondo').checked) vestierRoot.visible = false;
}

function onVestierProgress(xhr) {
  if (xhr.lengthComputable) {
    const pct = Math.round((xhr.loaded / xhr.total) * 100);
    document.getElementById('loading').textContent = `Cargando modelo… ${pct}%`;
  }
}

function cargarVestier(intentos = 3) {
  gltfLoader.load('Models/vestier.glb', onVestierLoad, onVestierProgress, (err) => {
    if (intentos > 0) {
      console.warn('Reintentando vestier.glb…', intentos);
      document.getElementById('loading').textContent = 'Reintentando…';
      setTimeout(() => cargarVestier(intentos - 1), 800);
    } else {
      console.error('[Room] Error:', err);
      document.getElementById('loading').textContent =
        'Error al cargar el modelo. Verifica la ruta Models/vestier.glb';
    }
  });
}

cargarVestier();

      n.material = n.material.clone();
      n.material.metalness  = 0;
      n.material.roughness  = 0.85;

      if (['hoddie_GEO', 'hoddie__stitchesBase_GEO', 'stitchesHood_GEO'].includes(n.name))
  n.material.color.set(new THREE.Color(23/255, 26/255, 100/255));

// ── Post-processing / SSAO ────────────────────────────────────────────────────
const composer = new THREE.EffectComposer(renderer);
const renderPass = new THREE.RenderPass(scene, camera);
composer.addPass(renderPass);

const ssaoPass = new THREE.SSAOPass(scene, camera, window.innerWidth, window.innerHeight);
ssaoPass.kernelRadius = 16;
ssaoPass.minDistance  = 0.001;
ssaoPass.maxDistance  = 0.02;   // ← MUY bajo para no oscurecer todo
ssaoPass.output       = THREE.SSAOPass.OUTPUT.Default;
ssaoPass.enabled      = false;
composer.addPass(ssaoPass);

let aoActivo = false;

document.getElementById('ao-toggle').addEventListener('change', (e) => {
  aoActivo = e.target.checked;
  ssaoPass.enabled = aoActivo;
});

document.getElementById('ao-radius').addEventListener('input', (e) => {
  ssaoPass.kernelRadius = parseFloat(e.target.value);
});

// Intensidad = maxDistance, rango muy fino
document.getElementById('ao-intensity').addEventListener('input', (e) => {
  ssaoPass.maxDistance = parseFloat(e.target.value);
});

document.getElementById('ao-samples').addEventListener('input', (e) => {
  ssaoPass.kernelSize = parseInt(e.target.value);
});

document.getElementById('ao-only').addEventListener('change', (e) => {
  ssaoPass.output = e.target.checked
    ? THREE.SSAOPass.OUTPUT.SSAO
    : THREE.SSAOPass.OUTPUT.Default;
});

// ── Loop de render ────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  camera.updateMatrixWorld();
  if (fondoDome) fondoDome.position.copy(camera.position);
  if (aoActivo) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
})();

// ── Responsive ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight); // ← AGREGAR
});
</script>
